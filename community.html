<body data-page="community">

  <!-- ============ 顶部导航（由 site-nav.js 注入） ============ -->
  <div data-nav="top"></div>



  <main>
    <div class="container">

      <section class="page-head">
        <div class="page-head-top">
          <div>
            <h1 class="page-title">社区广场</h1>
            <p class="page-subtitle">浏览诗友们分享的经典与原创。想唱和一首？右侧「我要分享」。</p>
          </div>
        </div>
        <p class="form-hint" id="feed-hint"></p>
      </section>

      <!-- 发布卡 -->
      <section class="card compose-card" id="compose" hidden>
        <div class="chip-wrap" id="compose-mode" style="margin-bottom:16px;">
          <span class="chip chip--active" data-compose-mode="original">原创诗词</span>
          <span class="chip" data-compose-mode="classic">分享经典</span>
        </div>

        <!-- 原创 -->
        <div id="compose-original">
          <input class="field" id="compose-title" type="text" placeholder="诗题（可留空，默认「无题」）" />
          <textarea class="field" id="compose-body" rows="5" placeholder="一行一句，写下你的这一首……"></textarea>
        </div>

        <!-- 分享经典 -->
        <div id="compose-classic" hidden>
          <input class="field" id="classic-search" type="search" placeholder="搜诗题或作者，从八万九千首里选，如：沁园春" />
          <div id="classic-results" class="classic-results"></div>
          <textarea class="field" id="classic-note" rows="3" placeholder="补一句你的推荐语（可选）"></textarea>
        </div>

        <div class="compose-foot">
          <span class="compose-hint">提交后进入审核队列，通过即公开</span>
          <div style="display:flex;gap:10px;">
            <button class="btn btn--ghost" data-compose-cancel type="button">取消</button>
            <button class="btn btn--primary" data-compose-submit type="button">提交审核</button>
          </div>
        </div>
      </section>

      <section class="page-body page-body--two page-body--community">

        <!-- 作品流 -->
        <div>
          <div id="post-list" style="display:flex;flex-direction:column;gap:16px;"></div>
        </div>

        <!-- 侧栏：我要分享 + 审核中心 + 投稿须知 -->
        <div class="side-column">
          <div class="card side-card">
            <h4>我要分享</h4>
            <p class="page-subtitle" style="margin:0 0 14px;">分享打动你的经典，或贴上自己的一首。来稿经审核后与全站相见。</p>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <button class="btn btn--primary btn--block" data-compose-open="original" type="button">写一首原创</button>
              <button class="btn btn--ghost btn--block" data-compose-open="classic" type="button">分享经典</button>
            </div>
          </div>

          <div class="card side-card" id="moderation-panel" hidden>
            <h4>审核中心 <span class="badge-pill badge-pending" id="moderation-count">0</span> 篇待审</h4>
            <div id="moderation-queue" class="review-queue"></div>
            <div class="divider" style="margin:16px 0;"></div>
            <h4>审核人</h4>
            <div class="chip-wrap" id="reviewer-list" style="margin-bottom:12px;"></div>
            <div id="reviewer-grant" hidden style="display:flex;gap:8px;">
              <input class="field" id="new-reviewer-name" type="email" placeholder="对方的登录邮箱" style="flex:1;" />
              <button class="btn btn--ghost" id="add-reviewer" type="button">授权</button>
            </div>
            <p class="form-hint" id="reviewer-hint" style="margin-top:10px;">审核权由站长授予，如被移除则需重新授权。</p>
          </div>
          <div class="card side-card">
            <h4>投稿须知</h4>
            <p class="page-subtitle" style="margin:0;">
              1. 原创请写自己的句子，经典请从库中检索分享。<br />
              2. 来稿先进入审核队列，通过后才公开。<br />
              3. 与他人唱和，多用鼓励之词。
            </p>
          </div>
        </div>

      </section>
    </div>
  </main>
