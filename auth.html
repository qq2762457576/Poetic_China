<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="注册诗意中国账号，解锁诗词课堂与挑战闯关，学习进度自动保存。" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://qq2762457576.github.io/Poetic_China/auth.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="诗意中国" />

  <meta property="og:image:alt" content="诗意中国 — 读诗 学诗 写诗" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://qq2762457576.github.io/Poetic_China/assets/og-image.png" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/style.css?v=20260912f" />
</head>
<body data-page="auth">

  <div class="auth-page">
    <!-- ============ 左侧墨色区 ============ -->
    <aside class="auth-side">
      <a class="brand-row" href="index.html">
        <span class="seal">诗</span>
        <span class="brand-name">诗意中国</span>
      </a>

      <div style="display:flex;flex-direction:column;gap:20px;">
        <p class="quote">粗缯大布裹生涯，<br />腹有诗书气自华。</p>
        <div class="rule"></div>
        <span class="quote-from">苏轼 · 和董传留别</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <span class="join">与同好共此一轮明月</span>
        <span class="join-sub">读诗、学诗、写诗，学习进度与闯关成绩自动保存</span>
      </div>
    </aside>

    <!-- ============ 右侧表单区 ============ -->
    <div class="auth-main">
      <div class="auth-form-wrap">
        <div class="auth-tabs">
          <a class="auth-tab" data-mode="login">登录</a>
          <a class="auth-tab is-active" data-mode="register">注册</a>
        </div>

        <!-- 注册 -->
        <form data-panel="register">
          <div>
            <h2 class="form-title">创建你的诗友账号</h2>
            <p class="form-sub">注册后即可解锁诗词课堂与挑战闯关</p>
          </div>

          <div class="field">
            <label for="reg-account">邮箱</label>
            <input id="reg-account" type="email" placeholder="用于登录和找回密码" />
          </div>
          <div class="field">
            <label for="reg-name">笔名</label>
            <input id="reg-name" type="text" placeholder="给自己取个笔名，如：沈砚秋" />
          </div>
          <div class="field">
            <label for="reg-pwd">密码</label>
            <input id="reg-pwd" type="password" placeholder="至少 8 位，含字母与数字" />
          </div>

          <label class="agree-row">
            <input type="checkbox" id="reg-agree" style="width:16px;height:16px;accent-color:#9c3b2e;flex:none;" />
            我已阅读并同意《社区公约》与《隐私政策》
          </label>

          <button class="btn btn--primary btn--block" type="submit">注册并开始学诗</button>
          <p class="form-hint" data-hint></p>
        </form>

        <!-- 登录 -->
        <form data-panel="login" hidden>
          <div>
            <h2 class="form-title">欢迎回来</h2>
            <p class="form-sub">登录后继续你的读诗进度与闯关成绩</p>
          </div>

          <div class="field">
            <label for="login-account">邮箱</label>
            <input id="login-account" type="text" placeholder="输入注册时填写的账号" />
          </div>
          <div class="field">
            <label for="login-pwd">密码</label>
            <input id="login-pwd" type="password" placeholder="输入密码" />
          </div>

          <div class="switch-row" style="justify-content:flex-end;">
            <button type="button" class="linklike" id="goto-reset">忘记密码？</button>
          </div>

          <button class="btn btn--primary btn--block" type="submit">登录</button>
          <p class="form-hint" data-hint></p>
        </form>

        <!-- 找回密码：填邮箱收重置邮件（2.6） -->
        <form data-panel="reset" hidden>
          <div class="form-head">
            <h2 class="form-title">找回密码</h2>
            <p class="form-sub">填注册时的邮箱，我们会发一封重置链接邮件</p>
          </div>
          <div class="field">
            <label for="reset-email">邮箱</label>
            <input id="reset-email" type="email" placeholder="注册时填写的邮箱" />
          </div>
          <button class="btn btn--primary btn--block" type="submit">发送重置邮件</button>
          <p class="form-hint" data-hint></p>
          <p class="form-hint"><button type="button" class="linklike" data-switch="login">想起密码了，返回登录</button></p>
        </form>

        <!-- 设置新密码：点邮件里的链接回到本页后出现 -->
        <form data-panel="newpwd" hidden>
          <div class="form-head">
            <h2 class="form-title">设置新密码</h2>
            <p class="form-sub">重置链接已验证，请输入新密码</p>
          </div>
          <div class="field">
            <label for="new-pwd">新密码</label>
            <input id="new-pwd" type="password" placeholder="至少 8 位，含字母与数字" />
          </div>
          <div class="field">
            <label for="new-pwd2">再输一遍</label>
            <input id="new-pwd2" type="password" placeholder="两次输入要一致" />
          </div>
          <button class="btn btn--primary btn--block" type="submit">保存新密码</button>
          <p class="form-hint" data-hint></p>
        </form>

        <div class="oauth-row">
          <button class="oauth-btn" type="button">微信登录</button>
          <button class="oauth-btn" type="button">微博登录</button>
        </div>

        <div class="switch-row">
          <span>已有账号？</span>
          <a data-switch="login">直接登录</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/data/site-stats.js?v=20260912f" defer></script>
  <script src="assets/data/aliases.js?v=20260912f" defer></script>
  <script src="assets/js/config.js?v=20260912f" defer></script>
  <script src="assets/js/cloud.js?v=20260912f" defer></script>
  <script src="assets/js/main.js?v=20260912f" defer></script>
</body>
</html>
