  <main>
    <div class="container">
      <!-- ============ 页面头部 ============ -->
      <section class="page-head">
        <div class="page-head-top">
          <div>
            <h1 class="page-title">诗词库</h1>
            <p class="page-subtitle" id="library-stat-line">—</p>

          </div>
          <div class="progress-pill">
            <span id="library-progress-text">我的进度 · 已学 0 首</span>
            <div class="progress-track"><div class="progress-fill" id="library-progress-fill" style="width:0%"></div></div>
          </div>
        </div>

        <form class="search-row" id="library-search-form">
          <div class="search-big">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#A0968A" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="#A0968A" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="library-search" type="search" placeholder="搜诗题、诗人或其中一句，如：明月几时有" aria-label="搜索诗词" />
          </div>
          <button class="btn-search" type="submit">检索</button>
        </form>

        <!-- 最近搜索：有记录且输入框为空时才显示（JS 控制），不打扰正常检索 -->
        <div class="hot-row history-row" id="history-row" hidden>
          <span class="label">最近搜索</span>
          <span id="history-chips"></span>
          <a class="history-clear" id="history-clear" href="javascript:void(0)">清除</a>
        </div>

        <div class="hot-row">
          <span class="label">热门检索</span>
          <span class="chip" data-hotword="杜甫">杜甫</span>
          <span class="chip" data-hotword="秋天">秋天</span>
          <span class="chip" data-hotword="边塞">边塞</span>
          <span class="chip" data-hotword="送别">送别</span>
        </div>
      </section>

      <!-- 移动端横滑筛选 -->
      <div class="chip-scroller">
        <span class="chip chip--active" data-filter-key="dynasty" data-value="全部朝代">全部</span>
        <span class="chip" data-filter-key="dynasty" data-value="唐">唐</span>
        <span class="chip" data-filter-key="dynasty" data-value="宋">宋</span>
        <span class="chip" data-filter-key="genre" data-value="词">词</span>
        <span class="chip" data-filter-key="theme" data-value="山水">山水</span>
      </div>

      <!-- ============ 主体 ============ -->
      <section class="page-body page-body--two">
        <!-- 左侧筛选 -->
        <div class="filter-col">

            <a class="side-item" data-filter-key="dynasty" data-value="近现代">近现代</a>
          </div>

          <div class="card side-card">
            <h4>体裁</h4>
            <div class="chip-wrap" id="filter-genre">
              <span class="chip chip--active" data-filter-key="genre" data-value="全部">全部</span>
              <span class="chip" data-filter-key="genre" data-value="诗">诗</span>
              <span class="chip" data-filter-key="genre" data-value="词">词</span>
              <span class="chip" data-filter-key="genre" data-value="曲">曲</span>
              <span class="chip" data-filter-key="genre" data-value="赋">赋</span>
              <span class="chip" data-filter-key="genre" data-value="文">文</span>
            </div>
          </div>

          <div class="card side-card">
            <h4>学习状态</h4>
            <div class="chip-wrap" id="filter-status">
              <span class="chip chip--active" data-filter-key="status" data-value="全部">全部</span>
              <span class="chip" data-filter-key="status" data-value="未学">未学</span>
              <span class="chip" data-filter-key="status" data-value="已学">已学</span>
              <span class="chip" data-filter-key="status" data-value="已收藏">已收藏</span>
            </div>
          </div>

          <div class="card side-card">
            <h4>主题意象</h4>
            <div class="chip-wrap" id="filter-theme">
              <span class="chip chip--active" data-filter-key="theme" data-value="全部">全部</span>
              <span class="chip" data-filter-key="theme" data-value="山水">山水</span>
              <span class="chip" data-filter-key="theme" data-value="边塞">边塞</span>
              <span class="chip" data-filter-key="theme" data-value="思乡">思乡</span>
              <span class="chip" data-filter-key="theme" data-value="咏物">咏物</span>
              <span class="chip" data-filter-key="theme" data-value="送别">送别</span>
              <span class="chip" data-filter-key="theme" data-value="怀古">怀古</span>
              <span class="chip" data-filter-key="theme" data-value="秋天">秋天</span>
              <span class="chip" data-filter-key="theme" data-value="咏怀">咏怀</span>

          </div>
        </div>

        <!-- 列表 -->
        <div>

            <div class="sort-tabs" id="sort-tabs">
              <a class="sort-tab is-active" data-sort="推荐">推荐</a>
